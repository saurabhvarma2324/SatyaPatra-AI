version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: satyapatra-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - satyapatra-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Python AI & OCR Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: satyapatra-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - satyapatra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # 3. Node.js Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satyapatra-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/satyapatra_ai
      - JWT_SECRET=satyapatra_production_super_secret_jwt_key_2026
      - AI_ENGINE_URL=http://ai-service:8000
      - CORS_ORIGIN=*
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - satyapatra-network

  # 4. React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satyapatra-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - satyapatra-network

networks:
  satyapatra-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
